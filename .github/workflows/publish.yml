# PyPI'ye yayın: GitHub release yayımlanınca ya da elle (Actions → publish → Run workflow). Parola/jeton yok: PyPI
# "Trusted Publisher" (OIDC) olarak bu depo + workflow + `pypi` ortamı tanımlı olmalı, yoksa yayın başarısız olur.
# Aynı sürüm PyPI'de zaten varsa yükleme reddedilir (yerelden twine ile yüklenmiş sürümler için beklenen durum).
name: publish
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
