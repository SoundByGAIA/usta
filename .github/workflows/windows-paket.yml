name: windows-paket
# Python'u içinde taşıyan Windows uygulaması (PyInstaller); kurulum ve Store paketi bunun üstüne kurulur.
on:
  workflow_dispatch:
  push:
    branches: [deneme/windows-paket]

permissions:
  contents: read

jobs:
  paket:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kurulum
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps .
          python -m pip install pyinstaller==6.11.1
      - name: Paketle
        run: >
          pyinstaller --noconfirm --windowed --name Usta
          --collect-data usta --collect-submodules usta --collect-submodules uvicorn
          kurulum/windows/usta_app.py
      - name: Paketli uygulamayı aç ve kapat
        shell: pwsh
        run: |
          $env:USTA_HOME = "$env:RUNNER_TEMP\ustahome"
          $p = Start-Process dist\Usta\Usta.exe -ArgumentList "--no-browser" -PassThru
          for ($i = 0; $i -lt 60 -and -not (Test-Path "$env:USTA_HOME\running.json"); $i++) { Start-Sleep 1 }
          $port = (Get-Content "$env:USTA_HOME\running.json" | ConvertFrom-Json).port
          $ok = $false
          for ($i = 0; $i -lt 30 -and -not $ok; $i++) { try { Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:$port/" | Out-Null; $ok = $true } catch { Start-Sleep 1 } }
          if (-not $ok) { Get-Content "$env:USTA_HOME\usta.log"; throw "portal açılmadı" }
          $h = @{ Authorization = "Bearer " + (Get-Content "$env:USTA_HOME\token" -Raw).Trim() }
          foreach ($f in "/app.js", "/stream.js") { Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:$port$f" | Out-Null }
          Invoke-WebRequest -UseBasicParsing -Method Post "http://127.0.0.1:$port/quit" -Headers $h | Out-Null
          if (-not $p.WaitForExit(15000)) { throw "kapanmadı" }
          Get-Content "$env:USTA_HOME\usta.log"
          "boyut: " + [math]::Round((Get-ChildItem dist\Usta -Recurse | Measure-Object Length -Sum).Sum / 1MB) + " MB"
      - uses: actions/upload-artifact@v4
        with:
          name: Usta-windows
          path: dist/Usta
          retention-days: 7
