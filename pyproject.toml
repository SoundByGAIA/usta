[project]
name = "usta"
version = "0.4.4"
description = "Genel amaçlı, açık kaynak yapay zekâ ajanı"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Ordis" }, { name = "Uğur Can Leba" }, { name = "Ceren Yıldız" }, { name = "Berke Dündar" }, { name = "Claude (Anthropic)" }]
keywords = ["ai", "agent", "coding-agent", "llm", "ollama", "harness"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "fastapi>=0.115", "uvicorn>=0.30", "pypdf>=6.21.4"]

[project.scripts]
usta = "usta.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
symbols = [
  "tree-sitter>=0.23",
  "tree-sitter-python>=0.23",
  "tree-sitter-javascript>=0.23",
  "tree-sitter-typescript>=0.23",
  "tree-sitter-go>=0.23",
  "tree-sitter-rust>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/usta"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "kurulum", "LICENSE", "NOTICE", "README*.md", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: gerçek Docker gerektirir"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
